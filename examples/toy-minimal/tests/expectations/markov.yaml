# 分布テストの基準（第2節「分布基準の置き場」）。N と種もここ。区間は仮置き（ADR-013）
name: markov
workflow_version: "0.2"       # 較正した分類体系の版（定義を変えたら較正し直す。F5）
origin: { kind: workflow_start }      # 起点。保存した開始時スナップショットからの起動は v0.1 では未対応（欄だけ）
runs: 300
seed: 100
stages:
  verify:
    first: { goal: { min: 0.45, max: 0.65 }, checks_failed: { min: 0.2, max: 0.4 }, unknown: { max: 0.2 } }
    reentry: { goal: { min: 0.7 }, checks_failed: { max: 0.25 } }
  check_section:
    first: { goal: { min: 0.5, max: 0.7 }, inconsistent: { min: 0.3, max: 0.5 } }
outcomes:
  completed: { min: 0.2 }
  aborted: { max: 0.8 }
