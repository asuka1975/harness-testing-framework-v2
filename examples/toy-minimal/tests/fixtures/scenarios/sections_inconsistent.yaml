# 台本: 子 check_section が inconsistent を 2 回（max 1 を超えて stuck）→ 集約で sections_inconsistent → verify へ（フェーズ内）
name: sections_inconsistent
claims: [主張A, 主張B]
outcomes:
  collect: [goal]
  draft: [goal]
  verify: [goal, goal]
  elaborate: [goal, goal]
child_outcomes:
  - write_section: [goal]
    check_section: [inconsistent, inconsistent]
  - write_section: [goal]
    check_section: [goal]
user: simulator
human: []
expect:
  status: completed
  transitions: [next, next, next, subworkflow_aggregate, rollback_within_phase, next, subworkflow_aggregate, next]
