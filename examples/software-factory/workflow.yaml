# software-factory: 要求の取り込みからリリースまでのソフトウェア開発ワークフロー（htf の実例ハーネス）
#
# 版 0.2（htf の ADR-014。第三者レビューと Codex のレビューの採用分を反映）
# 5 フェーズ 9 ステージ + 子ワークフロー 1 つ（implement-task.yaml。タスクごとに起動）。
#   discovery: intake（ユーザー待ち）→ analyze
#   design:    design → plan（タスク分割。設計の割当て漏れも検出する）
#   build:     implement（子 implement-task: code → check → unit_test）→ integrate（統合）
#   assure:    verify → review
#   release:   release（ユーザー待ち）
# 遷移の形:
#   フェーズ内ロールバック: analyze → intake、plan → design、（子）check → code、unit_test → code
#   フェーズ境界を越えるロールバック: design → analyze、implement → plan、integrate → plan、verify → plan、
#     review → plan、review → design、release → analyze、release → plan
#   carry: すべてのロールバック辺。二段以上続けて戻っても鍵が消えないよう、各辺は「戻り先より後ろのステージへ
#     運ばれうる鍵」もまとめて運ぶ（閉包。ADR-014 14.6.7。通過用の鍵は戻り先の memory_in と元の memory_out に並ぶ）
#   ユーザー待ち: intake（要求の聞き取りと、analyze から carry された質問）、release（リリースの承認）
#   子の集約: implement
# 指標の実装は metrics/、名前は metrics/manifest.json。成果物の形は docs/plan.md 第 1 節。
workflow:
  name: software-factory
  description: 依頼者から要求を聞き取り、要件・設計・タスクに落とし、実装・統合・検証・レビューを経てリリースする
  version: "0.2"
  phases:
    - id: discovery
      name: Discovery
      description: 依頼者から要求を聞き取り、受け入れ基準つきの要件にする
      goal:
        qualitative: 見送りでない全ての要件が、テストで確かめられる受け入れ基準を持ち、未決の質問が残っていない
        quantitative:
          criteria_per_requirement:
            description: 見送りでない要件ごとの、テストの nodeid を持つ受け入れ基準の数の最小値
            min: 1
          open_question_count:
            description: requirements.json の open_questions の数
            max: 0
      stages:
        - id: intake
          name: Intake
          description: >-
            依頼者に決まった順で質問し（役割、要約、欲しい機能、制約、受け入れの確かめ方）、回答を
            intake/answers.json に、読みやすい形を intake/request.md に書く。制約は任意（空でよい）。役割・要約・機能・
            受け入れの確かめ方は必須で、空の回答は受理せず聞き直す。その場で答えが無い質問は中断して待つ（空の回答や
            仮の回答で終えない）。analyze から open_questions を carry された再進入では、その質問も続けて尋ね、回答を
            intake/answers.json の clarifications に書く。memory_in の他の鍵は後段のステージへの通過用で、intake は読まない
          user_input: true
          artifacts:
            writes: [intake/]
            memory_in:
              - open_questions
              # 通過用（analyze → intake の閉包。ADR-014 14.6.7）
              - conflicts
              - rejection_feedback
              - design_issues
              - uncovered_components
              - unassigned_requirements
              - unfinished_tasks
              - merge_failures
              - regressions
              - unmet_criteria
              - suite_coverage_gaps
              - suite_lint_violations
              - review_comments
          goal:
            qualitative: >-
              intake/answers.json に、依頼者の役割、要約、欲しい機能の一覧、受け入れの確かめ方が空でなく記録され、
              carry された質問があれば、そのすべてに clarifications で回答が記録されている。制約（constraints）は空でもよい。
            quantitative:
              intake_complete:
                description: >-
                  intake/answers.json の role・summary・features・acceptance と、尋ねた追加の質問の回答がすべて空でない
                equals: true
          end_state:
            - id: unknown
              description: 上記に当てはまらない、または分類の確信度が低い。人間に差し戻す。
          rollback: []
        - id: analyze
          name: Analyze
          description: >-
            intake/answers.json から要件（id、題目、受け入れ基準とそれを確かめるテストの nodeid）を
            requirements.json に書く。依頼者に確かめないと決められない点は open_questions に書いて memory に出す。
            carry された conflicts は、依頼者の組の規則に従って片方を見送るか、両立すると記録する。carry された
            rejection_feedback（kind が requirements）は見送りへの合意として反映する。memory_in の他の鍵は後段への通過用
          artifacts:
            reads: [intake/]
            writes: [requirements.json]
            memory_in:
              - conflicts
              - rejection_feedback
              # 通過用（design → analyze、release → analyze の閉包）
              - design_issues
              - uncovered_components
              - unassigned_requirements
              - unfinished_tasks
              - merge_failures
              - regressions
              - unmet_criteria
              - suite_coverage_gaps
              - suite_lint_violations
              - review_comments
            memory_out:
              - open_questions
              # 通過用（analyze → intake の carry に並べるため）
              - conflicts
              - rejection_feedback
              - design_issues
              - uncovered_components
              - unassigned_requirements
              - unfinished_tasks
              - merge_failures
              - regressions
              - unmet_criteria
              - suite_coverage_gaps
              - suite_lint_violations
              - review_comments
          goal:
            qualitative: >-
              requirements.json に見送りでない要件が一つ以上あり、それぞれが一つ以上の受け入れ基準を持ち、各基準に
              確かめるテストの nodeid があり、open_questions が空である。intake/answers.json の欲しい機能がすべて、
              いずれかの要件（見送りを含む）に対応している。
            quantitative:
              active_requirement_count:
                description: requirements.json の見送りでない要件の数
                min: 1
              criteria_per_requirement:
                description: 見送りでない要件ごとの、テストの nodeid を持つ受け入れ基準の数の最小値
                min: 1
              open_question_count:
                description: requirements.json の open_questions の数
                max: 0
          end_state:
            - id: ambiguous
              description: >-
                requirements.json の open_questions に、依頼者に確かめないと要件か受け入れ基準を決められない質問が
                一つ以上あり、各質問にそれが妨げている要件の id が記録されている。
            - id: unknown
              description: 上記に当てはまらない、または分類の確信度が低い。人間に差し戻す。
          rollback:
            - state: ambiguous
              stage: intake
              carry:
                - open_questions
                - conflicts
                - rejection_feedback
                - design_issues
                - uncovered_components
                - unassigned_requirements
                - unfinished_tasks
                - merge_failures
                - regressions
                - unmet_criteria
                - suite_coverage_gaps
                - suite_lint_violations
                - review_comments
              max: 2
    - id: design
      name: Design
      description: 見送りでない要件をコンポーネントに割り当て、実装タスクに分割する
      goal:
        qualitative: 見送りでない全ての要件がコンポーネントに割り当てられ、全てのコンポーネントがタスクで覆われている
        quantitative:
          tasks_cover_design:
            description: tasks.json の design_components がすべて、いずれかのタスクの components にある
            equals: true
          unassigned_requirement_count:
            description: tasks.json の unassigned_requirements の数
            max: 0
      stages:
        - id: design
          name: Design
          description: >-
            requirements.json の見送りでない要件をコンポーネント（id、モジュールのパス、満たす要件の id）に割り当てて
            design.json に書く。design.json の requirements には見送りでない要件の id をすべて写す。同時には満たせない
            要件の組を見つけたら、design.json の conflicts に理由とともに書いて memory に出す。carry された
            design_issues / uncovered_components / unassigned_requirements は、反映した内容を design.json の
            revisions に記録する。memory_in の他の鍵は後段への通過用
          artifacts:
            reads: [requirements.json]
            writes: [design.json]
            memory_in:
              - design_issues
              - uncovered_components
              - unassigned_requirements
              # 通過用（plan → design、review → design の閉包）
              - unfinished_tasks
              - merge_failures
              - regressions
              - unmet_criteria
              - suite_coverage_gaps
              - suite_lint_violations
              - review_comments
              - rejection_feedback
            memory_out:
              - conflicts
              # 通過用（design → analyze の carry に並べるため）
              - design_issues
              - uncovered_components
              - unassigned_requirements
              - unfinished_tasks
              - merge_failures
              - regressions
              - unmet_criteria
              - suite_coverage_gaps
              - suite_lint_violations
              - review_comments
              - rejection_feedback
          goal:
            qualitative: >-
              requirements.json の見送りでない要件の id の集合が design.json の requirements と一致し、その全てを
              design.json の components が少なくとも一度ずつ満たし、conflicts が空である。
            quantitative:
              design_covers_requirements:
                description: design.json の requirements の id がすべて、いずれかのコンポーネントの satisfies にある
                equals: true
              design_conflict_count:
                description: design.json の conflicts の数
                max: 0
          end_state:
            - id: requirements_conflict
              description: >-
                design.json の conflicts に、同時には満たせない要件の組が一つ以上、両方の要件の id と理由つきで
                記録されている。
            - id: unknown
              description: 上記に当てはまらない、または分類の確信度が低い。人間に差し戻す。
          rollback:
            - state: requirements_conflict
              stage: analyze
              carry:
                - conflicts
                - design_issues
                - uncovered_components
                - unassigned_requirements
                - unfinished_tasks
                - merge_failures
                - regressions
                - unmet_criteria
                - suite_coverage_gaps
                - suite_lint_violations
                - review_comments
                - rejection_feedback
              max: 1
        - id: plan
          name: Plan
          description: >-
            design.json のコンポーネントを実装タスク（id、題目、機能、コンポーネント、変更してよいパス scope、
            走らせるテストファイル tests）に分割して tasks.json に書き、tasks を memory に出す。tasks.json には
            design.json のコンポーネント id（design_components）、requirements.json の見送りでない要件の id
            （requirement_ids）、design.json のコンポーネントが満たす要件の id（assigned_requirement_ids）も写し、
            どのコンポーネントにも満たされない要件を unassigned_requirements に、どのタスクにも割り当てなかった
            コンポーネントを uncovered_components に書く。タスクの id は再計画でも維持し、タスクを分割・統合した時は
            旧 id を notes に書く。carry された unfinished_tasks / merge_failures / regressions / unmet_criteria /
            suite_coverage_gaps / suite_lint_violations / review_comments / rejection_feedback（kind が quality）は、
            該当するタスクの notes に書く
          artifacts:
            reads: [design.json, requirements.json]
            writes: [tasks.json]
            memory_in:
              - unfinished_tasks
              - merge_failures
              - regressions
              - unmet_criteria
              - suite_coverage_gaps
              - suite_lint_violations
              - review_comments
              - rejection_feedback
            memory_out:
              - tasks
              - uncovered_components
              - unassigned_requirements
              # 通過用（plan → design の carry に並べるため）
              - unfinished_tasks
              - merge_failures
              - regressions
              - unmet_criteria
              - suite_coverage_gaps
              - suite_lint_violations
              - review_comments
              - rejection_feedback
          goal:
            qualitative: >-
              requirements.json の見送りでない要件がすべて design.json のいずれかのコンポーネントに満たされ、
              tasks.json のタスクが design.json の全てのコンポーネントを覆い、タスク同士の scope が重ならず、
              各タスクに一つ以上のテストファイルがあり、carry された差し戻しがあれば該当するタスクの notes に
              書かれている。
            quantitative:
              task_count:
                description: tasks.json のタスクの数
                min: 1
              tasks_cover_design:
                description: tasks.json の design_components がすべて、いずれかのタスクの components にある
                equals: true
              unassigned_requirement_count:
                description: tasks.json の unassigned_requirements の数
                max: 0
              task_scopes_disjoint:
                description: 二つ以上のタスクの scope に入っているパスが無い
                equals: true
          end_state:
            - id: design_incomplete
              description: >-
                tasks.json の unassigned_requirements に、requirements.json の見送りでない要件のうち design.json の
                どのコンポーネントにも満たされないものの id が一つ以上ある。この状態は design_gap に優先する。
            - id: design_gap
              description: >-
                tasks.json の uncovered_components に、どのタスクにも割り当てられていない design.json の
                コンポーネントの id が一つ以上ある。
            - id: unknown
              description: 上記に当てはまらない、または分類の確信度が低い。人間に差し戻す。
          rollback:
            - state: design_incomplete
              stage: design
              carry:
                - unassigned_requirements
                - unfinished_tasks
                - merge_failures
                - regressions
                - unmet_criteria
                - suite_coverage_gaps
                - suite_lint_violations
                - review_comments
                - rejection_feedback
              max: 1
            - state: design_gap
              stage: design
              carry:
                - uncovered_components
                - unfinished_tasks
                - merge_failures
                - regressions
                - unmet_criteria
                - suite_coverage_gaps
                - suite_lint_violations
                - review_comments
                - rejection_feedback
              max: 1
    - id: build
      name: Build
      description: タスクごとに実装と単体テストを行い、変更を一つのコードベースに統合する
      goal:
        qualitative: 統合したコードベースがビルドできる
        quantitative:
          merged_build_passed:
            description: codebase/ の全 .py がバイトコンパイルできる
            equals: true
      stages:
        - id: implement
          name: Implement
          description: >-
            tasks の各タスクについて子ワークフロー implement-task.yaml を起動し、tasks/<i>/ で実装・検査・単体テストを
            させる。子 run が終わったら本体が、各タスクの終わり方（check.json と unit/report.json の事実）を
            tasks/summary.json に書き、check か unit_test で止まったタスク（ビルド失敗、scope 外、lint 違反、テストの
            失敗、カバレッジ不足）を unfinished_tasks に書く。統合は次の integrate が行う
          artifacts:
            reads: [tasks.json]
            writes: [tasks/]
            memory_in: [tasks]
            memory_out: [unfinished_tasks]
          subworkflow:
            ref: implement-task.yaml
            each: tasks
            item_as: task
            workspace: tasks/
            aggregate:
              # 子の unknown は人間に届ける（明示の escalate を他の規則より上に置く。CONTRACT 第 7 節 4）
              - state: unknown
                when:
                  any: { stage: code, state: unknown }
              - state: unknown
                when:
                  any: { stage: check, state: unknown }
              - state: unknown
                when:
                  any: { stage: unit_test, state: unknown }
              - state: tasks_unfinished
                when:
                  any: { stage: check, state: build_failed }
              - state: tasks_unfinished
                when:
                  any: { stage: check, state: out_of_scope }
              - state: tasks_unfinished
                when:
                  any: { stage: check, state: lint_failed }
              - state: tasks_unfinished
                when:
                  any: { stage: unit_test, state: tests_failing }
              - state: tasks_unfinished
                when:
                  any: { stage: unit_test, state: coverage_low }
          # 子を持つステージでは goal 定性も end_state の記述も分類器に渡されない（評価順序の 2 と 3 が集約規則に
          # 置き換わる。CONTRACT 第 4 節・第 7 節 4）。下の記述は文書上の説明
          goal:
            qualitative: >-
              全てのタスクが check と単体テストを通り、tasks/summary.json にその事実が記録されている。
            quantitative:
              tasks_summary_complete:
                description: tasks/summary.json が tasks の全タスクの終わり方（done / 止まったステージと状態）を持つ
                equals: true
          end_state:
            - id: tasks_unfinished
              description: >-
                一つ以上のタスクが check か unit_test で止まり（ビルド失敗、scope 外の変更、lint 違反、単体テストの失敗、
                カバレッジ不足のいずれかが子の中のやり直しの後も残る）、そのタスクの id と失敗の要旨が
                tasks/summary.json の unfinished にある。
            - id: unknown
              description: 上記に当てはまらない、または分類の確信度が低い。人間に差し戻す。
          rollback:
            - state: tasks_unfinished
              stage: plan
              carry: [unfinished_tasks]
              max: 1
        - id: integrate
          name: Integrate
          description: >-
            tasks/summary.json で done のタスクの変更（tasks/<i>/repo/ の、check.json の changed_paths）を fixtures の
            base に統合して codebase/ に置き、統合の記録（merged、skipped、conflicts、failures、changed_paths）を
            merge.json に書く。同じパスを二つ以上のタスクが変えていれば conflicts に、統合後のビルドの失敗や
            scope 外のパスは failures に書き、まとめて merge_failures に出す
          artifacts:
            reads: [tasks/, tasks.json]
            writes: [codebase/, merge.json]
            memory_in: [tasks]
            memory_out: [merge_failures]
          goal:
            qualitative: >-
              merge.json の merged に done の全タスクがあり、conflicts と failures が空で、codebase/ がそれらの変更を
              統合した形でビルドでき、base から変わったパスがすべていずれかのタスクの scope にある。
            quantitative:
              merged_build_passed:
                description: codebase/ の全 .py がバイトコンパイルできる
                equals: true
              merged_paths_in_scope:
                description: codebase/ で fixtures の base から変わったパスがすべて、いずれかのタスクの scope にある
                equals: true
              merge_conflict_count:
                description: merge.json の conflicts と failures の数の合計
                max: 0
          end_state:
            - id: merge_failed
              description: >-
                merge.json の conflicts に同じパスを変えた二つ以上のタスクの組があるか、failures に統合後のビルドの
                失敗か scope 外のパスが記録されている。
            - id: unknown
              description: 上記に当てはまらない、または分類の確信度が低い。人間に差し戻す。
          rollback:
            - state: merge_failed
              stage: plan
              carry: [merge_failures]
              max: 1
    - id: assure
      name: Assure
      description: 統合したコードベースを検証し、レビューする
      goal:
        qualitative: テストスイート全体が通り、マージを妨げるレビューの指摘が無い
        quantitative:
          suite_passed:
            description: verification/results.json のテストスイート全体が一件以上あり、全て通っている
            equals: true
          blocking_comment_count:
            description: review.json の severity が blocking の指摘の数
            max: 0
      stages:
        - id: verify
          name: Verify
          description: >-
            codebase/ でビルド、lint、テストスイート全体（カバレッジ付き）を走らせ、requirements.json の
            見送りでない要件の受け入れ基準ごとに、そのテストの結果を照合する。要旨（ビルドと lint の合否、失敗した
            テスト、カバレッジとその不足、基準ごとの照合）を verification/report.json に、正規化したツールの出力の
            全体を verification/results.json に書く
          artifacts:
            reads: [codebase/, requirements.json]
            writes: [verification/]
            memory_out: [regressions, unmet_criteria, suite_coverage_gaps, suite_lint_violations]
          goal:
            qualitative: >-
              verification/report.json に、codebase/ のビルド成功、lint 違反なし、テストスイート全体の全テスト通過、
              src/ 配下全体の行カバレッジが 0.85 以上、全ての受け入れ基準のテストが存在して passed であることが
              記録されている。
            quantitative:
              suite_passed:
                description: verification/results.json のテストスイート全体が一件以上あり、全て通っている
                equals: true
              suite_coverage:
                description: verification/results.json に記録された codebase/ の src/ 配下全体の行カバレッジ
                min: 0.85
              suite_lint_clean:
                description: verification/results.json に記録された codebase/ の ruff の違反が無い
                equals: true
              criteria_verified_ratio:
                description: 受け入れ基準のうち、確かめるテストがテストスイートの結果にあって passed のものの割合
                min: 1.0
          end_state:
            - id: regression
              description: >-
                verification/report.json で、テストスイート全体のテストが一件以上 failed か error になっている
                （各タスクの単体テストに含まれない既存のテストを含む）。失敗したテストの nodeid の一覧が
                report.json の failed にある。この状態は criteria_unmet、coverage_short、lint_dirty に優先する。
            - id: criteria_unmet
              description: >-
                verification/report.json でテストは全て通っているが、受け入れ基準のうち一つ以上で、確かめるはずの
                テストがテストスイートの結果に無いか passed でない。該当する基準の id とテストの nodeid が
                report.json の unmet にある。この状態は coverage_short と lint_dirty に優先する。
            - id: coverage_short
              description: >-
                verification/report.json でテストは全て通り受け入れ基準も満たしているが、src/ 配下全体の行カバレッジが
                0.85 未満で、カバーされていない行の一覧がファイルごとに report.json の coverage_gaps にある。
                この状態は lint_dirty に優先する。
            - id: lint_dirty
              description: >-
                verification/report.json でテストは全て通り受け入れ基準とカバレッジも満たしているが、lint の違反が
                一件以上あり、その一覧（パス、行、規則）が report.json の lint_violations にある。
            - id: unknown
              description: 上記に当てはまらない、または分類の確信度が低い。人間に差し戻す。
          rollback:
            - state: regression
              stage: plan
              carry: [regressions]
              max: 1
            - state: criteria_unmet
              stage: plan
              carry: [unmet_criteria]
              max: 1
            - state: coverage_short
              stage: plan
              carry: [suite_coverage_gaps]
              max: 1
            - state: lint_dirty
              stage: plan
              carry: [suite_lint_violations]
              max: 1
        - id: review
          name: Review
          description: >-
            codebase/ の変更を design.json と tasks.json に照らしてレビューし、指摘（対象のファイルかコンポーネント、
            重大度 severity（blocking / minor）、種類 kind（code / design の二値）、本文）を review.json に書く。
            未実装の機能や要件の取りこぼしは kind code（対象はそのモジュールのパス）の指摘にする。memory_in の鍵は
            後段への通過用ではなく、review は memory を読まない
          artifacts:
            reads: [codebase/, design.json, tasks.json]
            writes: [review.json]
            memory_out:
              - review_comments
              - design_issues
              # 通過用（review → design の carry に並べるため）
              - unfinished_tasks
              - merge_failures
              - regressions
              - unmet_criteria
              - suite_coverage_gaps
              - suite_lint_violations
              - rejection_feedback
          goal:
            qualitative: >-
              review.json に、マージを妨げる（severity が blocking の）指摘が一つも無い。指摘の kind はすべて code か
              design である。
            quantitative:
              blocking_comment_count:
                description: review.json の severity が blocking の指摘の数
                max: 0
          end_state:
            - id: design_flaw
              description: >-
                review.json に、kind が design で severity が blocking の指摘が一つ以上あり、各指摘が design.json の
                コンポーネントの id を挙げて、その分け方か責務の置き方の誤りを述べている。この状態は
                changes_requested に優先する。
            - id: changes_requested
              description: >-
                review.json に、kind が code で severity が blocking の指摘が一つ以上あり、各指摘が codebase/ の
                ファイルのパスを挙げている（未実装の機能の指摘を含む）。kind が design で blocking の指摘は無い。
            - id: unknown
              description: 上記に当てはまらない、または分類の確信度が低い。人間に差し戻す。
          rollback:
            - state: design_flaw
              stage: design
              carry:
                - design_issues
                - unfinished_tasks
                - merge_failures
                - regressions
                - unmet_criteria
                - suite_coverage_gaps
                - suite_lint_violations
                - review_comments
                - rejection_feedback
              max: 1
            - state: changes_requested
              stage: plan
              carry: [review_comments]
              max: 1
    - id: release
      name: Release
      description: リリースの記録を作り、依頼者の承認を得る
      goal:
        qualitative: リリースの記録がそろい、依頼者が承認している
        quantitative:
          release_manifest_valid:
            description: release/manifest.json の版が base_version より新しく、ファイルごとのダイジェストから計算した全体のダイジェストが記録と一致する
            equals: true
      stages:
        - id: release
          name: Release
          description: >-
            codebase/ のファイルごとのダイジェストと版（新しい版と base の版 base_version）を release/manifest.json に、
            要件ごとの変更点と見送った要件を release/CHANGELOG.md に書き、依頼者にリリースの承認を尋ねて回答
            （approved、承認しない時は reason と kind（requirements: 要件の見送りや変更 / quality: 実装や成果物の
            品質））を release/approval.json に書く。その場で答えが無ければ中断して待つ（approved: false で代用しない）
          user_input: true
          artifacts:
            reads: [codebase/, requirements.json, review.json]
            writes: [release/]
            memory_out:
              - rejection_feedback
              # 通過用（release → analyze の carry に並べるため）
              - design_issues
              - uncovered_components
              - unassigned_requirements
              - unfinished_tasks
              - merge_failures
              - regressions
              - unmet_criteria
              - suite_coverage_gaps
              - suite_lint_violations
              - review_comments
          goal:
            qualitative: >-
              release/manifest.json が codebase/ の全てのファイルのダイジェストと、base_version より新しい版を持ち、
              release/CHANGELOG.md が全ての要件（見送りを含む）に触れ、release/approval.json に依頼者の承認が
              記録されている。
            quantitative:
              release_manifest_valid:
                description: release/manifest.json の版が base_version より新しく、ファイルごとのダイジェストから計算した全体のダイジェストが記録と一致する
                equals: true
              changelog_covers_requirements:
                description: release/manifest.json の requirements の id がすべて release/CHANGELOG.md に現れる
                equals: true
              release_approved:
                description: release/approval.json の approved が true
                equals: true
          end_state:
            - id: rejected_requirements
              description: >-
                release/approval.json で依頼者がリリースを承認しておらず（approved が false）、kind が requirements で、
                要件の見送りや変更に関わる理由が reason に記録されている。
            - id: rejected_quality
              description: >-
                release/approval.json で依頼者がリリースを承認しておらず（approved が false）、kind が quality で、
                実装や成果物の品質に関わる理由が reason に記録されている。
            - id: unknown
              description: 上記に当てはまらない、または分類の確信度が低い。人間に差し戻す。
          rollback:
            - state: rejected_requirements
              stage: analyze
              carry:
                - rejection_feedback
                - design_issues
                - uncovered_components
                - unassigned_requirements
                - unfinished_tasks
                - merge_failures
                - regressions
                - unmet_criteria
                - suite_coverage_gaps
                - suite_lint_violations
                - review_comments
              max: 1
            - state: rejected_quality
              stage: plan
              carry: [rejection_feedback]
              max: 1
