# 台本: T3 の code が lint 違反（未使用の import）を残す → lint_clean が不成立で unknown → 親 unknown
# → 人間が goal 扱いで続行（ContinueAsGoal）。統合は単体テストを通ったタスクだけなので T3 は入らず、
# verify が受け入れ基準 R3 のテストの不在を criteria_unmet として見つける → plan へ → 二度目は correct
name: lint_unknown_continue
child_runs:
  - {}
  - {}
  - code: [lint]
human: [continue_as_goal]
expect:
  status: completed
  transitions: [next, next, next, next, subworkflow_aggregate, escalate_unknown, next, rollback_across_phase, next, subworkflow_aggregate, next, next, next, next]
