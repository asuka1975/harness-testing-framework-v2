# 台本: ドメイン専門家の依頼。R4（かな・漢字を残す）が R1 と衝突 → design が requirements_conflict（成果物から決まる）
# → analyze へ（境界越え、carry: conflicts）で R4 を見送る → ... → release で依頼者が承認しない（合意なしの見送り。
# kind: requirements）→ rejected_requirements → analyze へ（境界越え、carry: rejection_feedback）で見送りへの合意を記録
# → 二度目の release で承認
name: domain_expert_conflict
persona: domain_expert
human: []
expect:
  status: completed
  transitions:
    - next                   # intake
    - next                   # analyze
    - rollback_across_phase  # design → analyze（conflicts）
    - next                   # analyze（R4 を見送る）
    - next                   # design
    - next                   # plan
    - subworkflow_aggregate
    - next                   # implement
    - next                   # integrate
    - next                   # verify
    - next                   # review
    - rollback_across_phase  # release → analyze（rejection_feedback）
    - next                   # analyze（見送りに合意）
    - next                   # design
    - next                   # plan
    - subworkflow_aggregate
    - next                   # implement
    - next                   # integrate
    - next                   # verify
    - next                   # review
    - next                   # release
