# 台本: 最初の子 run（T1）の code が二度とも failing → unit_test が tests_failing を二度（max 1 を超えて stuck）
# → 集約で tasks_unfinished → plan へ（境界越え、carry: unfinished_tasks）→ 二度目の子 run は全て correct
name: tasks_unfinished
child_runs:
  - code: [failing, failing]
human: []
expect:
  status: completed
  transitions: [next, next, next, next, subworkflow_aggregate, rollback_across_phase, next, subworkflow_aggregate, next, next, next, next, next]
  child_runs: [3, 3]
