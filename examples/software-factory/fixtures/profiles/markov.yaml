# 確率的偽本体の構成（マルコフ性が成り立つ）。値は種つきの分布から引く。規則は ../scenarios/README.md
# - 再進入で分布が変わる: code は check / unit_test から carry（check_failures / test_failures / coverage_gaps）を
#   受けた再進入で、直した変更（correct）が出やすくなる（first 0.62 → reentry 0.85）。check と unit_test の再進入の
#   分布もそれに従って変わる（版 0.2: ビルド・lint・scope の失敗は check が code に戻す）
# - code の値は全てのタスクで同じ分布（タスクごとの持続する違いが無い）
name: markov
persona: product_owner          # intake / analyze / release はペルソナの回答から決まる（ここでは常に goal）
human: [abort]                  # escalate したら中止（run の結果 = aborted）
distributions:
  design:
    first: { goal: 0.87, requirements_conflict: 0.06, drops_requirement: 0.03, unknown: 0.04 }   # drops_requirement → plan が design_incomplete
    reentry: { goal: 0.95, unknown: 0.05 }
  plan:
    first: { goal: 0.6, two_tasks: 0.25, design_gap: 0.1, unknown: 0.05 }
    reentry: { goal: 0.7, two_tasks: 0.25, unknown: 0.05 }
  code:
    first:
      correct: 0.62
      failing: 0.08
      failing_edge: 0.07
      low_coverage: 0.08
      regression: 0.05          # slug にしか無い（他の機能では correct）
      missing_test: 0.03
      lint: 0.03
      broken: 0.02
      out_of_scope: 0.02
    reentry: { correct: 0.85, failing: 0.05, failing_edge: 0.05, low_coverage: 0.05 }
  review:
    first: { goal: 0.78, changes_requested: 0.12, design_flaw: 0.05, unknown: 0.05 }
    reentry: { goal: 0.9, changes_requested: 0.05, unknown: 0.05 }
split: null
