# split 構成（fixtures/profiles/split.yaml）の N と種（独立性検証とマルコフ合成の負例に使う）。区間は仮置き。
#   unit_test first の tests_failing: T1 は必ず落ちる（1 件）+ 他のタスク（平均 1.59 件が unit_test に届く）は 0.157
#     → (1 + 1.59 × 0.157) / 2.59 = 0.48
#   unit_test reentry の tests_failing: 再進入の大半が T1（必ず再び落ちる）→ 0.55 以上
#   run 全体: T1 が implement のたびに stuck → plan への辺の max 1 を超えて escalate → ほぼ全て aborted
name: split
origin: { kind: workflow_start }
runs: 150
seed: 200
stages:
  unit_test:
    first: { tests_failing: { min: 0.40, max: 0.56 } }
    reentry: { tests_failing: { min: 0.55 } }
outcomes:
  aborted: { min: 0.95 }
