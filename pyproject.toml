[project]
name = "harness-testing-framework"
version = "1.0.1"
description = "ワークフロー型エージェントハーネスのための汎用テスティングフレームワーク"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "jsonschema>=4.18",
    "PyYAML>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/htf"]

# スキーマの正本は schema/（保護ファイル）。配布物には htf/schema/ として同梱する（htf.schema 参照）
[tool.hatch.build.targets.wheel.force-include]
"schema/workflow.schema.json" = "htf/schema/workflow.schema.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# CI の段階（第5.7節、F5）: 整合性検査・決定論テスト・契約適合・トリアージは常時、oracle はナイトリー、
# distribution / e2e は手動（.github/workflows/ci.yml、docs/maintenance.md）
markers = [
    "distribution: 分布テスト（確率的偽本体を N 回実行する。手動の段）",
    "e2e: E2E カバレッジとマルコフ合成（手動の段）",
    "oracle: オラクル検証（κ・ECE・再実行一致。ナイトリーの段）",
]

[tool.coverage.run]
source = ["htf"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# docs/ と reports/ の Markdown 内コードブロックは記録なので整形しない。
# examples/*/fixtures はハーネスのフィクスチャ（意図的に壊れたコードを含む）なので対象外（adopting-gaps G-07）
extend-exclude = ["docs", "reports", "examples/*/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
# 行長は formatter に任せる。E501 は全角文字を幅 2 で数えるため日本語のコメントと文字列で誤検出する
ignore = ["E501"]
