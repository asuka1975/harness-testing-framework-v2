workflow:
  name: shrink_child
  description: w → check。check が bad なら w へ（max 1）
  inputs: [item]
  phases:
    - id: p
      name: P
      description: フェーズ
      goal: { qualitative: 完了, quantitative: {} }
      stages:
        - id: w
          name: W
          description: w.txt を書く
          artifacts: { writes: [w.txt], memory_in: [item, fix] }
          goal: { qualitative: w.txt がある, quantitative: {} }
          end_state:
            - { id: unknown, description: 上記に当てはまらない。人間に差し戻す }
          rollback: []
        - id: check
          name: Check
          description: w.txt を検査して c.json に書く
          artifacts: { reads: [w.txt], writes: [c.json], memory_in: [item], memory_out: [fix] }
          goal: { qualitative: c.json が goal を記録している, quantitative: {} }
          end_state:
            - { id: bad, description: c.json の outcome が bad である }
            - { id: unknown, description: 上記に当てはまらない。人間に差し戻す }
          rollback:
            - { state: bad, stage: w, carry: [fix], max: 1 }
